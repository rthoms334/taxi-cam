name: Reviewer evals

# Replays the reviewer on past incidents (.github/review/evals/cases): each
# case is the change that introduced a real defect, and the reviewer must
# report it as Important at its location. The number caught is compared with
# .github/review/evals/baseline.json. A pull request that changes the reviewer
# is scored with its own reviewer before it reaches main; a lower score fails.
# Also runs on demand. docs/pull-requests.md explains how to add a case.

on:
  pull_request:
    branches: [main]
    paths:
      - REVIEW.md
      - .github/review/prompt.md
      - .github/review/findings.schema.json
      - .github/review/evals/**
      - .github/workflows/pr-review.yml
      - .github/workflows/review-evals.yml
  workflow_dispatch:

concurrency:
  group: reviewer-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cases:
    name: List cases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - name: Check out the candidate reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List and validate cases
        id: list
        run: python3 .github/review/review.py list-cases --dir .github/review/evals/cases --github-output "$GITHUB_OUTPUT"

  replay:
    name: Replay ${{ matrix.case }}
    needs: cases
    if: needs.cases.outputs.ids != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.ids) }}
    steps:
      - name: Check out the candidate reviewer with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a Claude credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret (docs/pull-requests.md)."
            exit 1
          fi

      - name: Stage the candidate reviewer, then check out the incident
        id: stage
        env:
          CASE: ${{ matrix.case }}
        run: |
          case_file=".github/review/evals/cases/$CASE.json"
          python3 .github/review/review.py stage --out build/review --case "$case_file" --reviewer-from worktree --github-output "$GITHUB_OUTPUT"
          cp .github/review/review.py .github/review/review_tools.py "$RUNNER_TEMP/"
          git checkout --quiet --force --detach "$(jq -r .change "$case_file")"

      # Keep this step identical to the one in pr-review.yml (checked by test_workflows.py).
      - name: Review with Claude
        id: claude
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are the automated reviewer for this repository.
            The review directory is build/review (relative to the repository root).
            Read build/review/prompt.md and follow it exactly.
          claude_args: |
            --model ${{ vars.REVIEW_MODEL || 'claude-opus-5-5' }}
            --max-turns 80
            --json-schema '${{ steps.stage.outputs.schema }}'
            --allowedTools "Read" "Grep" "Glob" "Agent" "Task" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git blame:*)"

      - name: Validate the ranked findings
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: python3 "$RUNNER_TEMP/review.py" save --out build/review/findings.json

      - name: Keep the findings for scoring
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-${{ matrix.case }}
          if-no-files-found: error
          retention-days: 14
          path: build/review/findings.json

  score:
    # Required only when you want reviewer changes gated; see docs/pull-requests.md.
    name: Score reviewer
    needs: [cases, replay]
    if: ${{ !cancelled() && needs.cases.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the candidate reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch every replay's findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eval-*
          path: ${{ runner.temp }}/results

      - name: Score against the baseline
        run: |
          python3 .github/review/review.py score --cases .github/review/evals/cases --results "$RUNNER_TEMP/results" \
            --baseline .github/review/evals/baseline.json --summary "$GITHUB_STEP_SUMMARY"
