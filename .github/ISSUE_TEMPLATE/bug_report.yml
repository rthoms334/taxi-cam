name: Bug report
description: Report a Taxi Cam problem. The bug button in Taxi Cam fills in most of this form for you.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        **Easiest way:** in Taxi Cam, click the **bug icon above the version number**. Taxi Cam fills in your system details below and saves a report file with your logs.
        Then describe the problem here and add the report file to the **Logs** box. Please report one problem per issue.

  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: What you saw and what you expected instead. For camera problems, say which screen (left, right, lower) and which view (nose, tail, door). Copy any error message exactly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we see it happen?
      description: The steps that lead to the problem, if you know them. Airport, time of day and taxi speed help with camera problems. If it started after an update, say which.
      placeholder: |
        1. Load...
        2. Press...
        3. See...

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once so far
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Drag the report file (`taxi-cam-report-….zip`) into this box. Taxi Cam selects it in File Explorer when you click the bug icon, and copies its location so you can also click the attach bar below and paste it into **File name**.
        If Taxi Cam does not open, say so here and attach `bridge.log`: in File Explorer, type `%LOCALAPPDATA%\Taxi Cam` in the address bar and press Enter to find it.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video (optional)
      description: Pictures of the affected screens or cameras help with display problems; a short video helps with flicker. For a crash, a screenshot of the Windows error helps.

  - type: markdown
    attributes:
      value: |
        ### Filled in by Taxi Cam
        Check these and correct anything wrong. If you opened this page without Taxi Cam, fill in what you can.

  - type: input
    id: taxi_cam_version
    attributes:
      label: Taxi Cam version
      description: Shown at the bottom left of Taxi Cam.
    validations:
      required: true

  - type: input
    id: simulator_version
    attributes:
      label: MSFS 2024 version and store
      description: For example "1.5.7.0, Microsoft Store/Xbox app" or "Steam".
    validations:
      required: true

  - type: input
    id: aircraft
    attributes:
      label: Aircraft
      description: Add the aircraft's add-on version if you know it.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Computer and graphics
      description: Windows, CPU, memory, graphics card and driver, MSFS graphics options, and graphics tools such as ReShade, OptiScaler or overlays.

  - type: textarea
    id: runtime_snapshot
    attributes:
      label: Taxi Cam status
      description: Taxi Cam's state when you clicked the bug icon.

  - type: checkboxes
    id: privacy_check
    attributes:
      label: Before you submit
      options:
        - label: I understand this issue and its attachments are public. Taxi Cam removes my Windows user and computer names from the report file.
          required: true
